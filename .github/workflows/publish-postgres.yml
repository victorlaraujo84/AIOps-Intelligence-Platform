name: Publicar imagens PostgreSQL

on:
  push:
    branches: [codex/postgres-unified-release]
  workflow_dispatch:
    inputs:
      version:
        description: Tag imutável da versão (por exemplo v0.1.0-rc.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  acceptance:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      skip_itsm: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[no-itsm-ci]') }}
  publish:
    needs: acceptance
    concurrency:
      group: postgres-images-${{ inputs.version || github.sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
      SOURCE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar referência de publicação
        shell: bash
        run: |
          RELEASE_VERSION="$REQUESTED_VERSION"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            RELEASE_VERSION="rc-${GITHUB_SHA:0:12}"
          else
            [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9]+([.-][a-z0-9]+)*)?$ ]]
          fi
          printf 'RELEASE_VERSION=%s\n' "$RELEASE_VERSION" >> "$GITHUB_ENV"
          printf 'IMAGE_NAMESPACE=ghcr.io/%s\n' "${SOURCE_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Conferir se a versão está disponível
        shell: bash
        run: |
          for ref in "$IMAGE_NAMESPACE-web:$RELEASE_VERSION" "$IMAGE_NAMESPACE-api:$RELEASE_VERSION" \
            "$IMAGE_NAMESPACE-web:itsm-worker-$RELEASE_VERSION" "$IMAGE_NAMESPACE-web:weather-worker-$RELEASE_VERSION" \
            "$IMAGE_NAMESPACE-web:notification-worker-$RELEASE_VERSION"; do
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              printf 'A tag já existe: %s\n' "$ref" >&2
              exit 1
            fi
          done
      - name: Construir as imagens do mesmo commit
        run: |
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$SOURCE_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -f infra/docker/Dockerfile.web -t "$IMAGE_NAMESPACE-web:$RELEASE_VERSION" .
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$SOURCE_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -f infra/docker/Dockerfile.api -t "$IMAGE_NAMESPACE-api:$RELEASE_VERSION" .
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$SOURCE_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -f infra/docker/Dockerfile.itsm-worker -t "$IMAGE_NAMESPACE-web:itsm-worker-$RELEASE_VERSION" .
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$SOURCE_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -f infra/docker/Dockerfile.weather-worker -t "$IMAGE_NAMESPACE-web:weather-worker-$RELEASE_VERSION" .
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$SOURCE_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -f infra/docker/Dockerfile.notification-worker -t "$IMAGE_NAMESPACE-web:notification-worker-$RELEASE_VERSION" .
      - name: Publicar no GHCR
        run: |
          docker push "$IMAGE_NAMESPACE-web:itsm-worker-$RELEASE_VERSION"
          docker push "$IMAGE_NAMESPACE-web:weather-worker-$RELEASE_VERSION"
          docker push "$IMAGE_NAMESPACE-web:notification-worker-$RELEASE_VERSION"
          docker push "$IMAGE_NAMESPACE-api:$RELEASE_VERSION"
          docker push "$IMAGE_NAMESPACE-web:$RELEASE_VERSION"
