services:
  web:
    environment:
      AIOPS_POSTGRES_PILOT_ONLY: "true"
      AIOPS_POSTGRES_PILOT_WRITE_SITES: ${AIOPS_POSTGRES_PILOT_WRITE_SITES:-false}
      AIOPS_POSTGRES_PILOT_WRITE_ASSETS: ${AIOPS_POSTGRES_PILOT_WRITE_ASSETS:-false}
      AIOPS_POSTGRES_PILOT_WRITE_SERVICES: ${AIOPS_POSTGRES_PILOT_WRITE_SERVICES:-false}
      AIOPS_POSTGRES_PILOT_MANAGE_USERS: ${AIOPS_POSTGRES_PILOT_MANAGE_USERS:-false}
  proxy:
    ports: !override
      - "127.0.0.1:${AIOPS_PILOT_HTTPS_PORT:-9443}:443"
