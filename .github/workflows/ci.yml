name: CI — AIOps Intelligence Platform

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web-and-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Fixtures públicas exclusivas dos testes; não são segredos de implantação.
      AUTH_SESSION_SECRET: ci-fixture-session-key-not-for-production-2026
      CREDENTIAL_ENCRYPTION_KEY: ci-fixture-encryption-key-not-for-production-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npm run check:sqlite
      - run: npm run lint
      - run: npm run build
      - run: npm test

  python-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q services backtesting tests
      - run: python -B -m unittest discover -s tests/unit -p "test_python_*.py" -v

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: aiops-ci
    steps:
      - uses: actions/checkout@v4
      - name: Configurar e subir em volumes descartáveis
        run: |
          sh scripts/init-docker-env.sh
          docker compose --profile core config --quiet
          docker compose --profile core up --build -d --wait --wait-timeout 120
          docker compose --profile core run -T --rm --no-deps postgres-migrate
          docker compose --profile core exec -T postgres sh -ec '
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 \
              -c "SELECT tenant_id FROM canonical_events LIMIT 0" \
              -c "SELECT tenant_id FROM metric_samples LIMIT 0"
            history=$(psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -Atc \
              "SELECT string_agg(version::text, Chr(44) ORDER BY version) FROM aiops_admin.schema_migrations")
            test "$history" = 1,2,3,4,5,6,7,8,9
          '
          docker compose --profile core exec -T postgres sh -ec '
            exec psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f -
          ' < tests/integration/postgres-tenant-reader.sql
          docker compose --profile core exec -T postgres sh -ec '
            exec psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f -
          ' < tests/integration/postgres-tenant-links.sql
          docker compose --profile core exec -T postgres sh -ec '
            exec psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f -
          ' < tests/integration/postgres-identity-sessions.sql
          docker compose cp proxy:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/aiops-root.crt"
      - name: Ensaiar inventário do SQLite com rollback
        shell: bash
        run: |
          docker compose --profile core exec -T postgres sh -ec '
            exec psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -c "CREATE DATABASE aiops_inventory_rehearsal"
          '
          docker compose --profile core run -T --rm --no-deps -e PGDATABASE=aiops_inventory_rehearsal postgres-migrate
          umask 077
          snapshot="$RUNNER_TEMP/inventory-fixture.db"
          docker compose exec -T web node --import tsx --input-type=module - \
            < tests/integration/inventory-rehearsal-fixture.mjs > "$snapshot"
          python3 scripts/rehearse-inventory-migration.py "$snapshot" | \
            docker compose --profile core exec -T postgres sh -ec '
              exec psql -XqAt -F "|" -U "$POSTGRES_USER" -d aiops_inventory_rehearsal -f -
            ' > "$RUNNER_TEMP/inventory-counts.txt"
          awk -F '|' 'NF == 3 && $2 > 0 && $2 == $3 { matched++ } END { exit matched != 9 }' \
            "$RUNNER_TEMP/inventory-counts.txt"
          python3 scripts/rehearse-inventory-migration.py "$snapshot" --identity-project "$COMPOSE_PROJECT_NAME" \
            > "$RUNNER_TEMP/identity-counts.txt"
          awk -F '|' 'NF == 3 && $2 > 0 && $2 == $3 { matched++ } END { exit matched != 10 }' \
            "$RUNNER_TEMP/identity-counts.txt"
          test "$(awk -F '|' '$1 == "users" { print $2 }' "$RUNNER_TEMP/identity-counts.txt")" = 2
          docker compose --profile core exec -T postgres sh -ec '
            rows=$(psql -XAt -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d aiops_inventory_rehearsal -c "SELECT (SELECT count(*) FROM tenants) + (SELECT count(*) FROM users) + (SELECT count(*) FROM sessions)")
            test "$rows" = 0
          '
      - name: Validar HTTPS, bootstrap e sessão após reinício
        run: |
          ca="$RUNNER_TEMP/aiops-root.crt"
          cookies="$RUNNER_TEMP/aiops-cookies.txt"
          token="$(sed -n 's/^AIOPS_BOOTSTRAP_TOKEN=//p' .env)"
          curl --fail --silent --show-error --cacert "$ca" https://localhost/api/health
          curl --fail --silent --show-error --cacert "$ca" --output /dev/null https://localhost/
          curl --fail --silent --show-error --cacert "$ca" \
            --header "X-Bootstrap-Token: $token" --cookie-jar "$cookies" --output /dev/null \
            --json '{"email":"docker-ci@example.invalid","full_name":"Docker CI","password":"docker-ci-fixture-only","initial_tenant_name":"Docker CI"}' \
            https://localhost/api/auth/bootstrap
          docker compose --profile core restart web
          docker compose --profile core up -d --wait --wait-timeout 120
          curl --fail --silent --show-error --retry 5 --cacert "$ca" --cookie "$cookies" \
            https://localhost/api/auth/me | jq -e '.user.role == "super_admin" and .user.active_tenant_id != null'
      - name: Validar autenticação, inventário e auditoria PostgreSQL no FastAPI
        shell: bash
        run: |
          docker compose exec -T web node --input-type=module - \
            < tests/integration/postgres-auth-fixture.mjs | \
            docker compose --profile core exec -T postgres sh -ec '
              exec psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f -
            '
          export AIOPS_POSTGRES_AUTH_DSN=postgresql://aiops_auth_ci:auth-ci-fixture-only@postgres:5432/aiops_platform
          export AIOPS_POSTGRES_INVENTORY_DSN=postgresql://aiops_inventory_ci:inventory-ci-fixture-only@postgres:5432/aiops_platform
          export AIOPS_POSTGRES_SITE_WRITE_DSN=postgresql://aiops_site_write_ci:site-write-ci-fixture-only@postgres:5432/aiops_platform
          export AIOPS_POSTGRES_AUTH_SESSION_SECRET=ci-fixture-pg-auth-session-not-for-production
          docker compose --profile core up -d --no-deps --force-recreate --wait --wait-timeout 60 api
          docker compose --profile core exec -T api python - < tests/integration/postgres-auth-smoke.py
          audit_counts=$(docker compose --profile core exec -T postgres sh -ec '
            exec psql -XAt -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f -
          ' <<'SQL'
          SELECT a.action, count(*)
          FROM audit_logs a
          JOIN sites s ON s.id::text = a.resource_id AND s.tenant_id = a.tenant_id
          JOIN users u ON u.id = a.actor_user_id AND u.tenant_id = a.tenant_id
          WHERE s.code = 'RUNTIME-SITE' AND a.actor_role = 'tenant_operator'
            AND a.resource_type = 'site'
          GROUP BY a.action
          ORDER BY a.action;
          SQL
          )
          test "$audit_counts" = $'SITE_CREATED|2\nSITE_UPDATED|1'
      - name: Estado do ambiente em caso de falha
        if: failure()
        run: |
          docker compose --profile core ps
          docker compose --profile core logs --tail=80
      - name: Remover ambiente descartável
        if: always()
        run: docker compose --profile core down --volumes --remove-orphans
