# Enable with compose.yaml, compose.postgres-release.yaml and profiles core and notifications.
services:
  notification-worker:
    profiles: [notifications]
    image: ${AIOPS_NOTIFICATION_WORKER_IMAGE:-aiops-platform-notification-worker:local}
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.notification-worker
    environment:
      AIOPS_NOTIFICATION_DB_DSN: ${AIOPS_NOTIFICATION_DB_DSN:?configure AIOPS_NOTIFICATION_DB_DSN}
      AIOPS_WEBHOOK_ALLOWED_ORIGINS: ${AIOPS_WEBHOOK_ALLOWED_ORIGINS:-}
      AIOPS_NOTIFICATION_WRITES: ${AIOPS_POSTGRES_RELEASE_WRITES:-true}
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - type: bind
        source: ${AIOPS_WEBHOOK_CONFIG_DIR:?configure AIOPS_WEBHOOK_CONFIG_DIR}
        target: /run/aiops-webhooks
        read_only: true
    networks:
      - backend
      - notification-egress
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "test", "-s", "/tmp/aiops-notification-ready"]
      interval: 5s
      timeout: 2s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  notification-egress: {}
