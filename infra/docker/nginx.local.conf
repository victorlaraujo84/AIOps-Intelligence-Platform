# Apenas proxies fixos; não aceita URL de destino do cliente.
log_format local_safe '$remote_addr $request_method $uri $status $request_time';
access_log /dev/stdout local_safe;
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 8080;
    server_name _;
    client_max_body_size 2m;
    location / {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 8081;
    server_name _;
    client_max_body_size 2m;
    location / {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
