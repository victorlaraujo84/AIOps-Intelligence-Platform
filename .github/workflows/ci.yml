name: CI — AIOps Intelligence Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-and-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile services/api/app/main.py services/api/app/schemas.py services/correlation/rca.py services/feature-engine/temporal_guard.py services/ml-engine/models.py services/ai-agent/adapter.py backtesting/split.py
